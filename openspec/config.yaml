# openspec/config.yaml
schema: spec-driven

context: |
  Project: schedule-app (greenfield; only README.md and a PRD exist).
  Product: automatic WhatsApp scheduling for service businesses (see PRD*.md at repo root).
  Stack (decided in sprint-1-owner-pwa design): api/ = NestJS (Express) + Kysely + Postgres 16, Node 24;
  app/ = React 19 + Vite 8 + TypeScript PWA (React Router 7, TanStack Query, Tailwind v4, shadcn/ui,
  openapi-typescript + openapi-fetch client generated from api/openapi.json, vite-plugin-pwa).
  Layout: independent projects api/ and app/ (no root workspace); docker-compose.yml at root.
  Testing: api/ uses Vitest 5 + unplugin-swc; integration tests use @testcontainers/postgresql (needs Docker).
  Testing: app/ uses Vitest 5 + React Testing Library + jsdom + MSW 3 (no Docker needed).
  Style: api/ and app/ each have ESLint (typescript-eslint), Prettier and tsc strict (npm run lint / typecheck).
  Language contract: code identifiers in English, docs and comments in neutral Spanish.

strict_tdd: true

testing:
  detected: 2026-10-22
  runner:
    command: "npm test --prefix api"
    framework: vitest
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: "npm run lint --prefix api"
    type_checker: "npm run typecheck --prefix api"
    formatter: "prettier (api/.prettierrc.json)"
  projects:
    api:
      path: api
      strict_tdd: true
      test_command: "npm test --prefix api"
      unit_command: "npm run test:unit --prefix api"
      integration_command: "npm run test:integration --prefix api"
      integration_requires: docker
    app:
      path: app
      stack: "React + Vite + TypeScript PWA"
      strict_tdd: true
      framework: "vitest + @testing-library/react + jsdom + msw"
      test_command: "npm test --prefix app"
      lint_command: "npm run lint --prefix app"
      typecheck_command: "npm run typecheck --prefix app"
      build_command: "npm run build --prefix app"
      format_command: "npm run format:check --prefix app"
      contract_check_command: "npm run gen:api:check --prefix app"
      layers:
        unit: true
        component: true
        e2e: false
      integration_requires: none
      note: "Strict TDD active since work unit 12 through work unit 17 (service closure UI). Config-only pieces (Vite, PWA, Tailwind) are checked with a build plus config tests."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Do not assume backend or frontend stack until a decision is recorded
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale, including the stack choice
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include test runner setup early; re-run sdd-init afterwards to enable strict TDD
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "npm test --prefix api"
    test_commands:
      api: "npm test --prefix api"
      app: "npm test --prefix app"
  verify:
    test_command: "npm test --prefix api"
    build_command: "npm run build --prefix api"
    test_commands:
      api: "npm test --prefix api"
      app: "npm test --prefix app"
    build_commands:
      api: "npm run build --prefix api"
      app: "npm run build --prefix app"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
