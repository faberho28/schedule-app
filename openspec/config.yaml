# openspec/config.yaml
schema: spec-driven

context: |
  Project: schedule-app (greenfield; only README.md and a PRD exist).
  Product: automatic WhatsApp scheduling for service businesses (see PRD*.md at repo root).
  Stack (decided in sprint-1-owner-pwa design): api/ = NestJS (Express) + Kysely + Postgres 16, Node 24;
  app/ = React + Vite PWA (not created yet, planned for work unit 12).
  Layout: independent projects api/ and app/ (no root workspace); docker-compose.yml at root.
  Testing: api/ uses Vitest 5 + unplugin-swc; integration tests use @testcontainers/postgresql (needs Docker).
  Style: api/ has ESLint (typescript-eslint), Prettier and tsc strict (npm run lint / typecheck).
  Language contract: code identifiers in English, docs and comments in neutral Spanish.

strict_tdd: true

testing:
  detected: 2026-10-21
  runner:
    command: "npm test --prefix api"
    framework: vitest
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: "npm run lint --prefix api"
    type_checker: "npm run typecheck --prefix api"
    formatter: "prettier (api/.prettierrc.json)"
  projects:
    api:
      path: api
      strict_tdd: true
      test_command: "npm test --prefix api"
      unit_command: "npm run test:unit --prefix api"
      integration_command: "npm run test:integration --prefix api"
      integration_requires: docker
    app:
      path: app
      strict_tdd: false
      note: "Not created yet; sdd-init must be re-run after work unit 12."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Do not assume backend or frontend stack until a decision is recorded
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale, including the stack choice
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include test runner setup early; re-run sdd-init afterwards to enable strict TDD
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "npm test --prefix api"
  verify:
    test_command: "npm test --prefix api"
    build_command: "npm run build --prefix api"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
